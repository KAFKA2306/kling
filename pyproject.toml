[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kling-sdk"
version = "0.1.0"
description = "Unofficial Kling AI Python SDK and test harness"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Kling SDK Maintainers" }]
dependencies = [
    "httpx>=0.27,<0.28",
    "pydantic>=2.6,<3.0",
    "tenacity>=8.2,<9.0",
    "fastapi>=0.110,<1.0",
    "pyjwt>=2.8,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<0.25",
    "anyio>=4.0,<5.0",
    "coverage[toml]>=7.5,<8.0",
    "respx>=0.20,<0.21",
    "ruff>=0.5,<0.6",
]

[tool.setuptools]
packages = ["kling"]
package-dir = {"kling" = "."}

[tool.setuptools.package-data]
kling = ["api/**/*", "models/**/*", "usecases/**/*", "client.py", "config.py"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
asyncio_mode = "strict"
pythonpath = ["."]
